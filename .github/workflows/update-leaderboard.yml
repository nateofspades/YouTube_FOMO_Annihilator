name: Update and publish leaderboard

on:
  schedule:
    # Redundant daytime UTC triggers reduce the chance that a delayed or
    # skipped GitHub schedule leaves a New York calendar date unpublished.
    # Scheduled runs no-op after every category has that day's snapshot.
    - cron: '17 10,14,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect and rank videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SKIP_IF_CURRENT_DATE: ${{ github.event_name == 'schedule' }}
        run: python scripts/update_leaderboard.py

      - name: Commit the daily data
        run: |
          git config user.name 'nateofspades'
          git config user.email '33226599+nateofspades@users.noreply.github.com'
          git add docs/data
          git diff --cached --quiet || git commit -m "data: update leaderboard"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
