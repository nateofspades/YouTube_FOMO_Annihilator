<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archives · YouTube FOMO Annihilator</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10131a;color:#eef2ff}body{max-width:1080px;margin:auto;padding:32px 20px 64px}a{color:#9eb4ff}.meta{color:#b7c0d8}label{display:block;margin:20px 0 8px;font-weight:700}select{width:min(100%,420px);padding:10px;border:1px solid #53648d;border-radius:7px;background:#191f2c;color:#eef2ff;font:inherit}details{margin:14px 0;padding:14px;background:#191f2c;border-radius:10px}summary{cursor:pointer;font-weight:700}ol{padding-left:28px}li{margin:12px 0}.badge{display:inline-block;padding:2px 8px;border:1px solid #53648d;border-radius:999px;color:#c9d5ff;font-size:.8rem;white-space:nowrap}footer{margin-top:40px;font-size:.85rem;color:#aeb8cc;line-height:1.5}
  </style>
</head>
<body>
  <a href="index.html">← Current leaderboard</a>
  <h1>Daily archives</h1>
  <label for="category">Leaderboard category</label>
  <select id="category" name="category">
    <option value="ai">Artificial intelligence</option>
    <option value="emerging-businesses-startups">Emerging businesses &amp; startups</option>
    <option value="biotech-health-longevity">Biotech, health &amp; longevity</option>
    <option value="science-future-technology">Science &amp; future technology</option>
    <option value="software-developer-tools">Software &amp; developer tools</option>
  </select>
  <p class="meta">Expand a date to view that day’s published top 10.</p><main id="archive" aria-live="polite">Loading archive…</main>
  <footer>Independent and unofficial. Not affiliated with, sponsored by, endorsed by, or approved by YouTube, Google LLC, or listed channels. “YouTube” is a trademark of Google LLC.</footer>
  <script>
    const categories={ai:{title:'Artificial intelligence',data:'data/ai/archive.json',directory:'data/ai'},'emerging-businesses-startups':{title:'Emerging businesses & startups',data:'data/emerging-businesses-startups/archive.json',directory:'data/emerging-businesses-startups'},'biotech-health-longevity':{title:'Biotech, health & longevity',data:'data/biotech-health-longevity/archive.json',directory:'data/biotech-health-longevity'},'science-future-technology':{title:'Science & future technology',data:'data/science-future-technology/archive.json',directory:'data/science-future-technology'},'software-developer-tools':{title:'Software & developer tools',data:'data/software-developer-tools/archive.json',directory:'data/software-developer-tools'}};
    const select=document.querySelector('#category'),root=document.querySelector('#archive'),number=new Intl.NumberFormat('en-US');
    async function load(slug){const category=categories[slug]||categories.ai;select.value=categories[slug]?slug:'ai';document.title=`${category.title} archives · YouTube FOMO Annihilator`;root.textContent='Loading archive…';try{const response=await fetch(category.data,{cache:'no-store'});if(!response.ok)throw Error('No archived results yet.');const days=await response.json();const entries=await Promise.all(days.map(async day=>({day,data:await fetch(`${category.directory}/${day.date}.json`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`Archive unavailable for ${day.date}.`);return r.json()})})));root.textContent='';entries.forEach(({day,data})=>{const section=document.createElement('details');const date=new Date(`${day.date}T12:00:00`).toLocaleDateString(undefined,{dateStyle:'long'});section.innerHTML=`<summary>${date} · ${day.result_count} results</summary><ol></ol>`;const list=section.querySelector('ol');data.results.forEach(video=>{const item=document.createElement('li'),link=document.createElement('a'),badge=document.createElement('span');link.href=video.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=video.title;badge.className='badge';badge.textContent=video.source_type;item.append(link,document.createTextNode(` — ${video.channel_title} · `),badge,document.createTextNode(` · ${video.duration_minutes} min · ${number.format(video.view_count)} views`));list.append(item)});root.append(section)})}catch(exception){root.textContent=exception.message}}
    select.addEventListener('change',()=>{const url=new URL(location);url.searchParams.set('category',select.value);history.replaceState(null,'',url);load(select.value)});load(new URLSearchParams(location.search).get('category')||'ai');
  </script>
</body>
</html>
