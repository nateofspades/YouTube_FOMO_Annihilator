<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Software and developer tools archive · YouTube FOMO Annihilator</title><style>:root{color-scheme:dark;font-family:system-ui;background:#10131a;color:#eef2ff}body{max-width:1000px;margin:auto;padding:32px 20px}a{color:#9eb4ff}details{margin:14px 0;padding:14px;background:#191f2c;border-radius:10px}summary{cursor:pointer;font-weight:700}ol{padding-left:28px}li{margin:12px 0}.meta{color:#b7c0d8;font-size:.9rem}.badge{display:inline-block;padding:2px 8px;border:1px solid #53648d;border-radius:999px;color:#c9d5ff;font-size:.8rem;white-space:nowrap}</style></head><body><a href="index.html">← Current leaderboard</a><h1>Software and developer tools archive</h1><p class="meta">Expand a date to view that day’s published top 10.</p><main id="archive">Loading archive…</main><script>const root=document.querySelector('#archive'),number=new Intl.NumberFormat('en-US');fetch('../data/software-developer-tools/archive.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('No archived results yet.');return r.json()}).then(days=>Promise.all(days.map(async day=>({day,data:await fetch(`../data/software-developer-tools/${day.date}.json`).then(r=>r.json())})))).then(entries=>{root.textContent='';entries.forEach(({day,data})=>{const section=document.createElement('details');const date=new Date(`${day.date}T12:00:00`).toLocaleDateString(undefined,{dateStyle:'long'});section.innerHTML=`<summary>${date} · ${day.result_count} results</summary><ol></ol>`;const list=section.querySelector('ol');data.results.forEach(video=>{const item=document.createElement('li'),link=document.createElement('a'),badge=document.createElement('span');link.href=video.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=video.title;badge.className='badge';badge.textContent=video.source_type;item.append(link,document.createTextNode(` — ${video.channel_title} · `),badge,document.createTextNode(` · ${video.duration_minutes} min · ${number.format(video.view_count)} views`));list.append(item)});root.append(section)})}).catch(e=>root.textContent=e.message);</script></body></html>
